<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — Note Catatan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Oswald:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%230a0a0c%22/><path d=%22M13 2L3 14h9l-1 8 10-12h-9l1-8z%22 fill=%22%23dc2626%22/></svg>">
</head>
<body>

  <!-- BACKGROUND RUMAH HANTU + KUBURAN -->
  <div class="haunted-bg"></div>
  <div class="graveyard">
    <div class="grave"></div>
    <div class="grave"></div>
    <div class="grave"></div>
    <div class="grave"></div>
    <div class="grave"></div>
    <div class="grave"></div>
  </div>
  <div class="dead-tree dead-tree-left"></div>
  <div class="dead-tree dead-tree-right"></div>

  <div class="fog-a"></div>
  <div class="fog-b"></div>
  <div class="eyes eyes-1"></div>
  <div class="eyes eyes-2"></div>
  <div class="crack-overlay"></div>
  <div class="blood-drip-layer">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="whisper whisper-1"></div>
  <div class="whisper whisper-2"></div>
  <div class="shadow-figure"></div>

  <!-- Lentera rumah hantu -->
<div class="lantern lantern-left"></div>
<div class="lantern lantern-right"></div>
<div class="lantern-glow"></div>


  <div class="auth-page">

    <div class="auth-brand">
      <div class="auth-brand-content">
        <h1>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Note Catatan
        </h1>
        <p>Buat akun gratis untuk mulai menyimpan catatanmu dengan aman. Setiap akun hanya bisa melihat catatannya sendiri.</p>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-card">
        <h2>Buat akun baru</h2>
        <p class="auth-subtitle">Isi form di bawah untuk mendaftar.</p>

        <div id="register-message" class="form-message hidden"></div>

        <form id="register-form">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" required placeholder="nama@email.com" autocomplete="email" />

          <label for="register-password">Password</label>
          <input type="password" id="register-password" required placeholder="Minimal 6 karakter" autocomplete="new-password" />

          <label for="register-confirm-password">Konfirmasi Password</label>
          <input type="password" id="register-confirm-password" required placeholder="Ulangi password" autocomplete="new-password" />

          <button type="submit">Daftar</button>
        </form>

        <p class="auth-switch">
          Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </p>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
